tuningsets:
- name: UniformQPS
  initialdelay: 0
  qpsload:
    qps: 100
  randomizedload: null
  steppedload: null
  timelimitedload: null
  randomizedtimelimitedload: null
  parallelismlimitedload: null
  globalqpsload: null
  poissonload: null
- name: RandomizedSaturationTimeLimited
  initialdelay: 0
  qpsload: null
  randomizedload: null
  steppedload: null
  timelimitedload: null
  randomizedtimelimitedload:
    timelimit: 600000000000
  parallelismlimitedload: null
  globalqpsload: null
  poissonload: null
- name: RandomizedDeletionTimeLimited
